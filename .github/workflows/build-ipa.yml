name: DSH CI (tests; optional unsigned IPA)

# Push and manual dispatch execute XCTest, shell contracts, and real guest
# suites. Creating an unsigned IPA requires build_ipa=true on manual dispatch.
# No Apple ID, certificate, provisioning profile, or signing material is used.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "macOS runner label (xcode-27 = Xcode 27 preview, macos-26 = Xcode 26 stable)"
        type: choice
        options:
          - xcode-27
          - macos-26
          - macos-15
        default: xcode-27
      xcode_path:
        description: "Explicit Xcode path (leave empty to auto-pick: Xcode 27 first, then newest)"
        type: string
        default: ""
      build_ipa:
        description: "Explicitly archive/package an unsigned IPA after tests (requires separate authorization)"
        type: boolean
        default: false
      force_rootfs:
        description: "Rebuild the guest rootfs even if the cache hits"
        type: boolean
        default: false
      rootfs_focus:
        description: "Diagnostic wrong-token only, or the full acceptance workflow"
        type: choice
        options: [full, wrong-token]
        default: full
  push:
    # The v1.1 work lands on feature/plus-v1.1 first and is only merged once the
    # build and the guest verification both pass on the Harness 0.2.0-rc.2 tree.
    branches: [main, feature/plus-v1.1]
    paths:
      - ".github/workflows/build-ipa.yml"
      # Anything that shapes the guest image.  Without these, a lockfile or
      # overlay fix pushes without triggering a build and has to be dispatched
      # by hand -- which is how the stale 0.2.0-rc.2 lockfile slipped through
      # unverified on the first attempt.
      - "scripts/build-rootfs.sh"
      - "rootfs/**"
      - "tests/rootfs-test.sh"
      - "tests/guest-*"
      - "tests/guest_snapshot.py"
      - "tests/check-bridge-refusal.py"
      - "tests/check-session-lease-guest*.py"
      - "tests/service-events.mjs"
      - "tests/stub-bridge.mjs"
      - "tests/mock-deepseek.mjs"
      - "tests/emu-test.sh"
      - "tests/scripts-test.sh"
      - "tests/DSHTests/**"
      - "tests/DSHUITests/**"
      - "ish-arm64/**"
      - "app/**"
      - "scripts/gen-xcode-project.rb"
      - "scripts/run-xctests.sh"
      - "scripts/select-xcode.py"
      - "scripts/report-xctests.py"
      - "tests/lifecycle-test.sh"
      - "tests/native-runner-test.py"
      - "tests/session-*"
      - "tests/task-lifecycle-context-test.*"
      - ".gitattributes"
      - "tests/lifecycle-test.c"
      - "tests/flock-diagnostics-test.sh"
      - "tests/flock-diagnostics-test.c"
      - "tests/sqlite-lifecycle-test.c"
      - "tests/fakefs-db-failure-test.c"
      - "tests/fakefs-db-init-test.c"
      - "tests/fakefs-mount-recovery-test.c"
      - "tests/fakefs-umount-failure-test.c"
      - "tests/fakefs-db-failure-test.sh"
      - "tests/fakefs-db-init-test.c"
      - "tests/legacy-fakefs-wrapper-test.sh"
      - "tests/legacy-fakefs-wrapper-test.c"
      - "tests/fakefs-quiesce-test.c"
      - "tests/fakefs-quiesce-test.sh"
      - "tests/sqlite-fault-vfs.h"
      - "tests/lifecycle-admission-test.c"
      - "tests/lifecycle-admission-test.sh"
      - "tests/lifecycle-poll-cleanup-test.c"
      - "tests/lifecycle-poll-wait-test.c"
      - "tests/lifecycle-poll-wait-test.sh"
      - "tests/lifecycle-sigsuspend-test.c"
      - "tests/lifecycle-sigsuspend-test.sh"
      - "tests/lifecycle-tty-read-test.c"
      - "tests/lifecycle-tty-read-test.sh"
      - "tests/guest-exit-test.c"
      - "tests/guest-exit-test.sh"
      - "tests/futex-idle-test.c"
      - "tests/futex-idle-test.sh"
      - "tests/sockrestart-test.sh"
      - "tests/sockrestart-test.c"
      - "tests/xctest-runner-test.py"
      - "DSH.xcodeproj/**"

permissions:
  contents: read

concurrency:
  group: dsh-ipa-${{ github.ref }}-${{ github.event.inputs.runner_label || 'xcode-27' }}-${{ github.event.inputs.rootfs_focus || 'full' }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  build-and-test:
    if: github.event.inputs.rootfs_focus != 'wrong-token'
    name: Test DSH (optional IPA) (${{ github.event.inputs.runner_label || 'xcode-27' }})
    runs-on: ${{ github.event.inputs.runner_label || 'xcode-27' }}
    timeout-minutes: 240
    env:
      INPUT_XCODE_PATH: ${{ github.event.inputs.xcode_path }}
      INPUT_FORCE_ROOTFS: ${{ github.event.inputs.force_rootfs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Host info
        run: |
          set -x
          sw_vers
          uname -m
          HOSTNAME_VALUE="$(hostname)"
          echo "hostname: '${HOSTNAME_VALUE}' (${#HOSTNAME_VALUE} chars)"
          uname -a
          df -h /
          echo "--- runner labels ---"
          echo "ImageOS=$ImageOS  ImageVersion=$ImageVersion"
          echo "--- installed Xcodes ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          xcodebuild -version || true

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          XC="$(python3 scripts/select-xcode.py --requested "${INPUT_XCODE_PATH:-}")"
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "selected: $XC"
          xcode-select -p
          xcodebuild -version
          echo "xcode_path=$XC" >> "$GITHUB_OUTPUT"

      - name: Install build tools (meson ninja lld libarchive)
        run: |
          set -euo pipefail
          # libarchive is required even though the README does not mention it:
          # ish-arm64/tools/meson.build only builds tools/fakefsify (and the
          # unfakefsify symlink) when a *host* libarchive is found, and
          # scripts/build-rootfs.sh hard-fails without fakefsify.
          brew install meson ninja lld libarchive

          LLD_BIN="$(brew --prefix lld)/bin"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          export PATH="$LLD_BIN:$PATH"

          # Homebrew's libarchive may be keg-only; make it visible to
          # meson's pkg-config probe. The meson file also falls back to
          # /opt/homebrew/opt/libarchive/lib, so either path works.
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

          echo "--- toolchain ---"
          command -v meson && meson --version
          command -v ninja && ninja --version
          command -v ld.lld && ld.lld --version
          command -v node && node -v
          command -v npm && npm -v
          command -v python3 && python3 -V
          if pkg-config --exists libarchive; then
            echo "libarchive (pkg-config): $(pkg-config --modversion libarchive)"
          else
            echo "libarchive: not visible to pkg-config; meson will use the /opt/homebrew/opt/libarchive/lib fallback"
          fi

      - name: Ensure xcodeproj gem
        run: |
          set -euo pipefail
          if ruby -e 'require "xcodeproj"' 2>/dev/null; then
            echo "xcodeproj gem already available to $(command -v ruby)"
          else
            gem install xcodeproj --no-document || sudo gem install xcodeproj --no-document
          fi
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"'

      - name: Restore guest rootfs cache
        id: rootfs-cache
        if: ${{ github.event.inputs.force_rootfs != 'true' }}
        uses: actions/cache@v4
        with:
          path: build/root.tar.gz
          key: rootfs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rootfs/staging/package.json', 'rootfs/staging/package-lock.json', 'scripts/build-rootfs.sh', 'rootfs/overlay/**', 'ish-arm64/app/RootfsPatch.bundle/**') }}

      - name: Build iSH-ARM64 emulator
        run: |
          set -euo pipefail
          mkdir -p cilogs
          make emulator 2>&1 | tee cilogs/01-emulator.log

      - name: Verify emulator toolchain
        run: |
          set -euo pipefail
          B=ish-arm64/build-arm64-release
          for f in ish tools/fakefsify tools/unfakefsify; do
            if [ -x "$B/$f" ]; then
              echo "ok: $B/$f"
            else
              echo "error: missing $B/$f (libarchive missing means fakefsify is not built)" >&2
              exit 1
            fi
          done
          # A zero-length libvdso.so.elf means meson fell back to the stub,
          # which builds fine but leaves guest processes unable to run.
          VDSO="$(find "$B" -name 'libvdso.so.elf' -size +0c | head -1)"
          if [ -z "$VDSO" ]; then
            echo "error: VDSO is a stub (empty libvdso.so.elf) — ld.lld did not take effect" >&2
            exit 1
          fi
          echo "ok: real VDSO built at $VDSO"
          ls -lh "$VDSO"

      - name: Build guest rootfs (Alpine + Node + dsh)
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p cilogs
          make rootfs 2>&1 | tee cilogs/02-rootfs.log

      - name: Verify rootfs
        run: |
          set -euo pipefail
          ls -lh build/root.tar.gz
          shasum -a 256 build/root.tar.gz
          python3 -c "import hashlib,json; from pathlib import Path; expected=json.loads(Path('app/SessionLifecycle.bundle/manifest.json').read_text())['rootfs_sha256']; actual=hashlib.sha256(Path('build/root.tar.gz').read_bytes()).hexdigest(); assert actual==expected, 'Session-only update must retain the Build 26 rootfs; refusing an unintended data migration'"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          mkdir -p cilogs
          make project 2>&1 | tee cilogs/03-project.log

      - name: Execute simulator XCTest (units + real guest integration + UI)
        run: bash scripts/run-xctests.sh

      - name: Upload XCTest result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-xctest-results
          path: build/TestResults/
          if-no-files-found: error
          retention-days: 14

      - name: Archive app (unsigned)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa }}
        run: |
          set -euo pipefail
          mkdir -p cilogs
          set -o pipefail
          xcodebuild \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DSH.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee cilogs/04-archive.log

      - name: Package unsigned IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa }}
        id: package
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^MARKETING_VERSION = //p' app/AppDSH.xcconfig | tr -d ' \r')"
          BUILD_NO="$(sed -n 's/^CURRENT_PROJECT_VERSION = //p' app/AppDSH.xcconfig | tr -d ' \r')"
          echo "version=$VERSION build=$BUILD_NO"

          APP="build/DSH.xcarchive/Products/Applications/DSH.app"
          if [ ! -d "$APP" ]; then
            echo "error: $APP not found" >&2
            find build/DSH.xcarchive -maxdepth 4 2>/dev/null | head -40 >&2
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          find build/ipa -name '._*' -delete

          IPA_NAME="DSH-${VERSION}-build${BUILD_NO}-unsigned.ipa"
          ( cd build/ipa && zip -qry "../${IPA_NAME}" Payload )

          ls -lh "build/${IPA_NAME}"
          shasum -a 256 "build/${IPA_NAME}" | tee build/ipa.sha256
          echo "ipa_path=build/${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify IPA contents
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa }}
        run: |
          set -euo pipefail
          IPA="build/ipa/Payload"
          echo "=== zip listing (top) ==="
          unzip -l "build/${{ steps.package.outputs.ipa_name }}" | head -25
          echo
          echo "=== embedded .app size ==="
          du -sh "$IPA/DSH.app"
          echo
          echo "=== executable architecture (must contain arm64) ==="
          lipo -info "$IPA/DSH.app/DSH" || file "$IPA/DSH.app/DSH"
          echo
          echo "=== Info.plist ==="
          plutil -p "$IPA/DSH.app/Info.plist" \
            | grep -E '"CFBundleIdentifier"|"CFBundleShortVersionString"|"CFBundleVersion"|"MinimumOSVersion"|"CFBundleExecutable"|"CFBundleName"' || true
          echo
          echo "=== bundled guest image ==="
          ls -lh "$IPA/DSH.app/root.tar.gz" "$IPA/DSH.app/root.tar.gz.sha256" 2>/dev/null || true
          echo
          echo "=== signature status (unsigned is expected) ==="
          codesign -dvvv "$IPA/DSH.app" 2>&1 || echo "(no code signature — expected; re-sign before installing)"
          echo
          echo "=== top-level bundle entries ==="
          ls "$IPA/DSH.app" | head -40

      - name: Upload IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-ipa
          path: |
            build/${{ steps.package.outputs.ipa_name }}
            build/ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: cilogs/
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "## DSHIOS CI"
            echo
            echo "- runner: \`${{ github.event.inputs.runner_label || 'xcode-27' }}\`"
            echo "- Xcode: \`${{ steps.xcode.outputs.xcode_path }}\`"
            echo "- rootfs cache hit: \`${{ steps.rootfs-cache.outputs.cache-hit }}\`"
            echo "- IPA: \`${{ steps.package.outputs.ipa_name }}\`"
            echo
            echo "- IPA requested: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ipa }}"
            echo "Tests run by default. An IPA artifact is created only with explicit build_ipa=true."
          } >> "$GITHUB_STEP_SUMMARY"

  # This job independently proves the guest image actually bootstraps: it imports root.tar.gz the way the app does
  # (fakefsify), runs the project's own suites, and boots dsh-serve so the web UI
  # can be fetched over host loopback -- the same path the app's WKWebView uses.
  # Runs as its own job so a guest regression cannot invalidate a good IPA.
  verify-guest:
    name: Verify guest image boots and dsh serves (${{ github.event.inputs.runner_label || 'xcode-27' }})
    runs-on: ${{ github.event.inputs.runner_label || 'xcode-27' }}
    timeout-minutes: 150
    env:
      DSH_ROOTFS_FOCUS: ${{ github.event.inputs.rootfs_focus || 'full' }}
      DSH_GUEST_INITIAL_SAMPLE_AFTER: ${{ github.event.inputs.rootfs_focus == 'wrong-token' && '10' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools (meson ninja lld libarchive)
        run: |
          set -euo pipefail
          brew install meson ninja lld libarchive
          brew install bash
          LLD_BIN="$(brew --prefix lld)/bin"
          echo "$LLD_BIN" >> "$GITHUB_PATH"
          export PATH="$LLD_BIN:$PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Restore guest rootfs cache
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: build/root.tar.gz
          key: rootfs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rootfs/staging/package.json', 'rootfs/staging/package-lock.json', 'scripts/build-rootfs.sh', 'rootfs/overlay/**', 'ish-arm64/app/RootfsPatch.bundle/**') }}

      - name: Build iSH-ARM64 emulator
        run: |
          set -euo pipefail
          mkdir -p cilogs-verify
          # Keep release optimization. DWARF enables stopped-process, read-only
          # task/lock snapshots without adding a diagnostic thread to the guest.
          (cd ish-arm64 && meson setup build-arm64-release -Dguest_arch=arm64 --buildtype=release -Ddebug=true)
          make emulator 2>&1 | tee cilogs-verify/01-emulator.log

      - name: Build guest rootfs (only if the cache did not restore it)
        if: steps.rootfs-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p cilogs-verify
          make rootfs 2>&1 | tee cilogs-verify/02-rootfs.log

      - name: Verify rootfs present
        run: |
          set -euo pipefail
          ls -lh build/root.tar.gz
          shasum -a 256 build/root.tar.gz
          python3 -c "import hashlib,json; from pathlib import Path; expected=json.loads(Path('app/SessionLifecycle.bundle/manifest.json').read_text())['rootfs_sha256']; actual=hashlib.sha256(Path('build/root.tar.gz').read_bytes()).hexdigest(); assert actual==expected, 'Session-only update must retain the Build 26 rootfs; refusing an unintended data migration'"

      - name: Native runner execution and failure-propagation regressions
        run: python3 tests/native-runner-test.py

      - name: Guest helper real wait-status regressions (Bash 3.2 and Bash 5)
        run: |
          set -euo pipefail
          python3 tests/guest-helper-test.py --bash /bin/bash 2>&1 | tee cilogs-verify/helper-bash32.log
          python3 tests/guest-helper-test.py --bash "$(brew --prefix bash)/bin/bash" 2>&1 | tee cilogs-verify/helper-bash5.log

      - name: Native lifecycle regression tests
        run: bash tests/lifecycle-test.sh

      - name: Production flock identity, privacy and release regressions (ASan + UBSan)
        run: bash tests/flock-diagnostics-test.sh

      - name: Generation-scoped Node drain admission (native flock + ASan + UBSan)
        run: bash tests/session-drain-admission-test.sh

      - name: Production task-loop and cleanup identity (positive and old-code negative control)
        run: bash tests/task-lifecycle-context-test.sh

      - name: Session backend algorithm and controller regressions
        run: |
          set -euo pipefail
          python3 tests/session-lease-prepare.py --tarball build/root.tar.gz --extract-original build/session-lease-original.js
          node tests/session-lease-test.mjs build/session-lease-original.js 2>&1 | tee cilogs-verify/session-algorithm.log
          node tests/session-lease-controller-test.mjs 2>&1 | tee cilogs-verify/session-controller.log

      - name: Real guest session receipt and exit-evidence checker regressions
        run: |
          set -euo pipefail
          python3 tests/check-session-lease-guest-test.py 2>&1 | tee cilogs-verify/session-native-checker.log

      - name: Real guest session leases and 100 suspend/resume cycles
        run: |
          set -euo pipefail
          bash tests/session-lease-guest-test.sh build/root.tar.gz 2>&1 | tee cilogs-verify/session-native-guest.log

      - name: Real SQLite and fakefs fault injection regressions
        run: bash tests/fakefs-db-failure-test.sh

      - name: Legacy fakefs API error propagation regressions
        run: bash tests/legacy-fakefs-wrapper-test.sh

      - name: Real SQLite background transaction boundaries
        run: bash tests/fakefs-quiesce-test.sh

      - name: XCTest runner count and exit-code regressions
        run: python3 tests/xctest-runner-test.py

      - name: Socket recovery resource regression (real loopback + failure injection)
        run: bash tests/sockrestart-test.sh

      - name: Guest process exit identity regression (production exit + pthreads)
        run: bash tests/guest-exit-test.sh

      - name: Idle workers preserve a healthy guest (production futex + pthreads)
        run: bash tests/futex-idle-test.sh

      - name: Lifecycle admission regression (real pthreads + native flock)
        run: bash tests/lifecycle-admission-test.sh

      - name: Signal wait quiescence regression (production sigsuspend + pthreads)
        run: bash tests/lifecycle-sigsuspend-test.sh

      - name: TTY read quiescence regression (production read + pthreads + fd reuse)
        run: bash tests/lifecycle-tty-read-test.sh

      - name: Project test suites (script contract + emulator regressions + guest integration)
        run: |
          set -uo pipefail
          mkdir -p cilogs-verify
          rc_scripts=0
          rc_emu=0
          rc_rootfs=0
          echo "::group::tests/scripts-test.sh"
          tests/scripts-test.sh 2>&1 | tee cilogs-verify/02b-scripts-test.log || rc_scripts=$?
          echo "::endgroup::"
          echo "::group::tests/emu-test.sh"
          tests/emu-test.sh 2>&1 | tee cilogs-verify/03-emu-test.log || rc_emu=$?
          echo "::endgroup::"
          echo "::group::tests/rootfs-test.sh"
          tests/rootfs-test.sh 2>&1 | tee cilogs-verify/04-rootfs-test.log || rc_rootfs=$?
          echo "::endgroup::"
          {
            echo
            echo "## Guest verification"
            echo
            echo "| suite | exit |"
            echo "|---|---|"
            echo "| tests/scripts-test.sh (project + token-hygiene contract) | ${rc_scripts} |"
            echo "| tests/emu-test.sh (NEON gadgets, waitpid, fetch polyfill) | ${rc_emu} |"
            echo "| tests/rootfs-test.sh (boots dsh-serve, authenticates, every bridge tool) | ${rc_rootfs} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$rc_scripts" = 0 && test "$rc_emu" = 0 && test "$rc_rootfs" = 0

      - name: Verify no launch token leaked into the artefacts
        if: always()
        run: |
          set -uo pipefail
          # `dsh web: .../?token=<43 chars>` is a bearer credential for the
          # guest's UI. The serve log is printed and uploaded, so this is the
          # one place that can prove the redaction actually held rather than
          # trusting that every call site remembered.
          if [ -d build/rootfs-test ]; then
            hits=$(grep -rlE 'token=[A-Za-z0-9_-]{20,}' build/rootfs-test cilogs-verify 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "::error::launch token leaked into: $hits"
              exit 1
            fi
          fi
          echo "ok: no launch token in cilogs-verify/ or build/rootfs-test/"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-verification-logs
          path: |
            cilogs-verify/
            build/rootfs-test/dsh-serve.log
            build/rootfs-test/*.txt
            build/rootfs-test/*.yml
            build/rootfs-test/*.log
            build/rootfs-test/*.jsonl
            build/rootfs-test/guest-diagnostics/
            build/session-lease-guest.*/guest-diagnostics/
            build/session-lease-guest.*/session-native.log
            build/session-lease-guest.*/service-events.jsonl
            build/session-lease-guest.*/current-phase
          if-no-files-found: warn
          retention-days: 30
