# DSH iOS profile layer, applied after dsh-base and dsh-web-app.
#
# The whole Linux guest already runs inside the iOS app's sandbox, and the
# guest kernel has neither Landlock nor bubblewrap, so dsh's per-command
# sandbox would fail closed (SANDBOX_UNAVAILABLE). Tools therefore run
# unconfined *inside the guest*; the user-facing choice is only whether
# risky tool calls ask for approval.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_WORKSPACE ?? process.cwd()
- id: permission
  config:
    defaultPreset: guest-ask
    presets:
      guest-ask:
        sandbox: danger-full-access
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# Model catalog.
#
# dsh 0.2.x already ships the correct ids, so this layer changes only the two
# display names, to the wording the DeepSeek docs and console use. The ids are
# repeated here on purpose: `models` replaces the catalog wholesale rather than
# merging into it, so a layer naming only `name` would drop every other field
# and silently take v4-pro away with it.
#
# `deepseek-flash` is the id the API documents. The retired `deepseek-v4-flash`
# still answers, and is served by V4.1 at Flash prices, which is exactly why a
# regression here would be easy to miss -- tests/rootfs-test.sh asserts the old
# id is absent from the composed profile.
#
# Flash accepts images and Pro does not; the protocol hints (systemPromptUpdate,
# toolUpdate) are carried over from the shipped catalog and must not be dropped.
#
# contextWindow matches the API's 1M. maxTokens is left unset so the plugin's
# own default applies; that default tracks the documented output cap, and
# pinning it here would go stale. Reasoning effort (off/low/high/max) is not
# configured here either: the shipped default is what Settings exposes, and the
# layer should not silently narrow the user's choice.
- id: llm-deepseek
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        contextWindow: 1000000
